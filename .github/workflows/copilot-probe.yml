name: copilot probe
on: workflow_dispatch
permissions:
  contents: read
  copilot-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: npm install -g @github/copilot
      - run: |
          copilot --version
          copilot --help | grep -iA2 model || true
      - run: |
          copilot -p 'Reply only with the JSON object {"ok": true}' -s || echo "EXIT=$?"
      - run: |
          copilot -p 'Reply only with the JSON object {"ok": true}' -s --model gpt-5-mini || echo "EXIT=$?"
