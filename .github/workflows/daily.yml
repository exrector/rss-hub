name: daily digest
on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 МСК
  workflow_dispatch:
permissions:
  contents: write
  copilot-requests: write   # Copilot CLI на встроенном GITHUB_TOKEN
concurrency: digest
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install -g @github/copilot
      - run: python digest.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: |
          git config user.name "rss-hub"
          git config user.email "rss-hub@users.noreply.github.com"
          git add docs
          git commit -m "digest $(TZ=Europe/Moscow date +%F)" || exit 0
          git push
